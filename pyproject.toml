[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "freight-parser"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Add src/ to sys.path so `import freight_parser` works without an editable install.
pythonpath = ["src"]
testpaths  = ["tests"]
# Show short tracebacks for faster scanning; -v flag prints test names.
addopts    = "-v --tb=short"
